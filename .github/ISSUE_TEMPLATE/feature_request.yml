name: Feature request
description: Propose a bounded improvement to MyKeep.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals focused on one outcome. Do not include secrets, credentials,
        tokens, cookies, private member data, or private files. Security-sensitive
        details belong in the private process described in SECURITY.md.
  - type: textarea
    id: user-outcome
    attributes:
      label: User outcome
      description: Describe who benefits and the outcome they should be able to achieve.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In-scope boundaries
      description: State exactly what this request includes.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out-of-scope boundaries
      description: State what this request deliberately does not include.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: privacy-security
    attributes:
      label: Privacy and security considerations
      description: Explain effects on authentication, authorization, private storage, sensitive data, and logging. Write "None known" if no impact is expected.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and prerequisites
      description: Link prerequisite issues or PRs, or write "None known".
    validations:
      required: true
  - type: textarea
    id: ui-reference
    attributes:
      label: UI reference material (when applicable)
      description: Attach or link mockups, screenshots, or interaction notes for UI changes. Write "Not applicable" for non-UI work.
    validations:
      required: true
